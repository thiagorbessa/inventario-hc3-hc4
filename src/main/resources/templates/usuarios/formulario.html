<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Usuário - Inventário TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white p-3">
            <h5 class="mb-0 fw-bold">
                <i class="fa-solid fa-user-gear me-2"></i>
                <span th:text="${usuario.id == null ? 'Cadastrar Novo Usuário' : 'Editar Usuário'}"></span>
            </h5>
        </div>
        <div class="card-body p-4">

            <div th:if="${erro != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${erro}"></span>
            </div>

            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Completo</label>
                    <input type="text" th:field="*{nome}" class="form-control" required placeholder="Ex: João da Silva">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Login (Username)</label>
                    <input type="text" th:field="*{username}" class="form-control" required placeholder="Ex: joao.silva">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Senha
                        <small th:if="${usuario.id != null}" class="text-muted fw-normal">(Deixe em branco para manter a senha atual)</small>
                    </label>
                    <input type="password" th:field="*{password}" class="form-control" th:required="${usuario.id == null}" placeholder="******">
                </div>

                <!-- Se for MASTER: Exibe a seleção completa de perfis -->
                <div class="mb-4" th:if="${usuarioLogado.role.name() == 'ROLE_MASTER'}">
                    <label class="form-label fw-bold">Perfil de Acesso</label>
                    <select th:field="*{role}" class="form-select" required>
                        <option value="">Selecione o perfil...</option>
                        <option value="ROLE_VISUALIZADOR">VISUALIZADOR (Apenas visualiza)</option>
                        <option value="ROLE_ADMIN">ADMINISTRADOR (CRUD Equipamentos e Usuários Comuns)</option>
                        <option value="ROLE_MASTER">MASTER (Acesso Total + CRUD Admins)</option>
                    </select>
                </div>

                <!-- Se for ADMIN: Trava o perfil em VISUALIZADOR -->
                <div class="mb-4" th:if="${usuarioLogado.role.name() != 'ROLE_MASTER'}">
                    <input type="hidden" name="role" value="ROLE_VISUALIZADOR" />
                    <label class="form-label fw-bold">Perfil de Acesso</label>
                    <input type="text" class="form-control" value="VISUALIZADOR (Apenas visualiza)" readonly>
                    <div class="form-text mt-1 text-muted">
                        <small>Administradores só têm permissão para criar e gerenciar perfis do tipo VISUALIZADOR.</small>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/usuarios" class="btn btn-outline-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
