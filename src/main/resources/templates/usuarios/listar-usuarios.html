<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Usuários - Inventário TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid mx-4">
        <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-server me-2 text-info"></i>Inventário Unificado HC3 / HC4</a>
        <div class="d-flex align-items-center">
            <a href="/" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-house me-1"></i>Dashboard</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-2" style="max-width: 1000px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center p-3">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-users-gear me-2"></i>Controle de Usuários e Permissões</h5>
            <a href="/usuarios/novo" class="btn btn-success btn-sm fw-bold"><i class="fa-solid fa-user-plus me-1"></i>Novo Usuário</a>
        </div>
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Login / Username</th>
                        <th>Nível de Acesso</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}">1</td>
                        <td class="fw-bold" th:text="${u.nome}">Nome</td>
                        <td th:text="${u.username}">admin</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name() == 'ROLE_MASTER'} ? 'bg-danger' : (${u.role.name() == 'ROLE_ADMIN'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                                  th:text="${u.role.name().replace('ROLE_', '')}">MASTER</span>
                        </td>
                        <td class="text-center">

                            <th:block th:with="
                                isMaster = ${usuarioLogado.role.name() == 'ROLE_MASTER'},
                                podeEditar = ${isMaster or (u.role.name() == 'ROLE_VISUALIZADOR') or (usuarioLogado.id == u.id)},
                                podeDeletar = ${usuarioLogado.id != u.id and (isMaster or u.role.name() == 'ROLE_VISUALIZADOR')}
                            ">

                                <!-- Botão Editar -->
                                <a th:if="${podeEditar}" th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-outline-warning btn-sm me-1" title="Editar Usuário">
                                    <i class="fa-solid fa-user-pen"></i>
                                </a>

                                <!-- Botão Resetar Senha (Abre Modal) -->
                                <button th:if="${podeEditar}" type="button" class="btn btn-outline-secondary btn-sm me-1"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalResetSenha' + ${u.id}" title="Resetar Senha">
                                    <i class="fa-solid fa-key"></i>
                                </button>

                                <!-- Botão Excluir -->
                                <form th:if="${podeDeletar}" th:action="@{/usuarios/deletar/{id}(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir este usuário?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                                </form>

                                <span th:if="${!podeEditar and !podeDeletar}" class="text-muted small"><i class="fa-solid fa-lock me-1"></i>Protegido</span>

                                <!-- Modal de Resetar Senha -->
                                <div th:if="${podeEditar}" class="modal fade text-start" th:id="'modalResetSenha' + ${u.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header bg-dark text-white">
                                                <h5 class="modal-title"><i class="fa-solid fa-key me-2"></i>Resetar Senha - <span th:text="${u.username}"></span></h5>
                                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <form th:action="@{/usuarios/resetar-senha}" method="post">
                                                <div class="modal-body">
                                                    <input type="hidden" name="id" th:value="${u.id}">
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">Nova Senha</label>
                                                        <input type="password" name="novaSenha" class="form-control" required placeholder="Digite a nova senha">
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                                                    <button type="submit" class="btn btn-primary btn-sm">Confirmar Troca de Senha</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>

                            </th:block>

                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
