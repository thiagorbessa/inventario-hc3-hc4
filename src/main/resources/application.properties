spring.application.name=inventario

# ==========================================
# CONEXÃO COM O BANCO DE DADOS MYSQL (REDE DOCKER)
# ==========================================
spring.datasource.url=jdbc:mysql://mysql-db:3306/inventariodb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=inventario_user
spring.datasource.password=inventario_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURAÇÃO DO HIBERNATE / JPA
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa o H2 Console
spring.h2.console.enabled=false

# ==========================================
# LIMITE DE UPLOAD DE ARQUIVOS (EXCEL)
# ==========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# CONFIGURAÇÕES DO SPRINGDOC OPENAPI (SWAGGER)
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs