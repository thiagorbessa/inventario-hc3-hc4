<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Equipamento</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">Gerenciamento de Inventário</a>
    <div class="menu">
        <a href="/">Voltar ao Dashboard</a>
    </div>
</nav>

<div class="container" style="max-width: 800px;">
    <h2 th:text="${equipamento.patrimonioMicro == null ? 'Novo Equipamento' : 'Editar Equipamento'}"></h2>
    <br>

    <form th:action="@{/equipamentos/salvar}" th:object="${equipamento}" method="post">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Bloco 1: Micro -->
            <div>
                <h3 style="margin-bottom:10px; border-bottom:1px solid #ccc; padding-bottom:5px;">Dados do Micro</h3>

                <div class="form-group">
                    <label>Patrimônio do Micro (Chave)</label>
                    <!-- Se já existe, é readonly para não quebrar a relação -->
                    <input type="text" th:field="*{patrimonioMicro}" class="form-control" required th:readonly="${equipamento.patrimonioMicro != null}">
                </div>

                <div class="form-group">
                    <label>Unidade</label>
                    <select th:field="*{unidade}" class="form-control" required>
                        <option value="">Selecione...</option>
                        <option value="HC3">HC3</option>
                        <option value="HC4">HC4</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Netname</label>
                    <input type="text" th:field="*{netname}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Modelo do Micro</label>
                    <input type="text" th:field="*{modeloMicro}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Localização (Sala/Andar)</label>
                    <input type="text" th:field="*{local}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Ramal</label>
                    <input type="text" th:field="*{ramal}" class="form-control">
                </div>
            </div>

            <!-- Bloco 2: Rede & Monitor -->
            <div>
                <h3 style="margin-bottom:10px; border-bottom:1px solid #ccc; padding-bottom:5px;">Rede & Monitor</h3>

                <div class="form-group">
                    <label>MAC Address</label>
                    <input type="text" th:field="*{macAddress}" class="form-control">
                </div>

                <div class="form-group">
                    <label>IP do Micro</label>
                    <input type="text" th:field="*{ipMicro}" class="form-control">
                </div>

                <div class="form-group">
                    <label>IP Switch</label>
                    <input type="text" th:field="*{ipSwitch}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Porta Switch</label>
                    <input type="text" th:field="*{portaSwitch}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Patrimônio Monitor</label>
                    <input type="text" th:field="*{patrimonioMonitor}" class="form-control">
                </div>

                <div class="form-group">
                    <label>Número de Série Monitor</label>
                    <input type="text" th:field="*{serieMonitor}" class="form-control">
                </div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1.1em;">
                Salvar Dados Unificados
            </button>
        </div>
    </form>
</div>

</body>
</html>
